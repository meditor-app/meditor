# The sign-in relay for meditor (see relay.js). Deploy from this directory:
#
#   npx wrangler login
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler deploy
name = "meditor-auth"
main = "relay.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
# The GitHub App's client ID (public; it is in the page too).
GITHUB_CLIENT_ID = "Iv23liYmOPookZ1BEEfi"
# Pages allowed to use this relay, comma-separated.
ALLOWED_ORIGINS = "https://ondrik.github.io,http://localhost:8000"
