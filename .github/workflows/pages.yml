name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# The project has no dependencies and no build: the page is index.html and the ES modules
# in src/, published as they are.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # A directory argument is resolved as a module since Node 24; pass the glob.
      - run: node --test tests/*.test.js

  pages:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect the site
        run: mkdir _site && cp -r index.html src _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
